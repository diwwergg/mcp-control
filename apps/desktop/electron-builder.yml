appId: com.lnwjud.desktop
productName: lnwjud
asar: true
npmRebuild: false
directories:
  output: dist/installers
  buildResources: build
files:
  - dist/main/**/*
  - dist/renderer/**/*
  - build/icon.ico
  - build/icon.png
  - package.json
publish:
  provider: github
  owner: engasnm111
  repo: lnwjud
  releaseType: release
extraResources:
  - from: ../../packages/capabilities/src/windows-capability-bridge.ps1
    to: windows-capability-bridge.ps1
  - from: build/lnwjud-mcp-stdio.cjs
    to: lnwjud-mcp-stdio.cjs
  - from: build/lnwjud-mcp-stdio.cmd
    to: lnwjud-mcp-stdio.cmd
# Tunnel profile expects these next to lnwjud.exe (not only under resources/).
extraFiles:
  - from: build/lnwjud-mcp-stdio.cjs
    to: lnwjud-mcp-stdio.cjs
  - from: build/lnwjud-mcp-stdio.cmd
    to: lnwjud-mcp-stdio.cmd
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: lnwjud-Setup-${version}.${ext}
  # Keep the branded icon embedded in lnwjud.exe for Windows shortcuts and taskbar.
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  uninstallDisplayName: ${productName}
  include: build/installer.nsh
